<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1030" width="1500" height="1030" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#13aa52"/>
    </marker>
    <style>
      .box { fill: #f6f8fc; stroke: #b8c3d6; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12.5px; fill: #475569; }
      .l { font-size: 12px; fill: #334155; font-weight: 600; }
      .ln { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #13aa52; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1500" height="1030" fill="#ffffff"/>
  <text x="750" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">DisasterSync - technical architecture</text>
  <text x="750" y="60" text-anchor="middle" class="s">Three full replicas on two clouds. Every region keeps accepting writes while cut off, and merges deterministically when the link returns.</text>

  <!-- Browser -->
  <rect x="470" y="82" width="560" height="84" rx="12" class="box" stroke="#6366f1"/>
  <rect x="470" y="82" width="560" height="26" rx="12" fill="#6366f1"/>
  <text x="750" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Browser - DisasterSync dashboard (React + Vite)</text>
  <text x="750" y="132" text-anchor="middle" class="s">Overview: cart, regions, conflict ledger  |  Infrastructure: topology  |  Compare: vs baseline  |  Logs</text>
  <text x="750" y="152" text-anchor="middle" class="s">Served by every node at /ui/. Polls each region once a second.</text>

  <!-- Browser to regions -->
  <path class="ln" d="M620 166 L250 232" marker-end="url(#a)"/>
  <path class="ln" d="M750 166 L750 232" marker-end="url(#a)"/>
  <path class="ln" d="M880 166 L1250 232" marker-end="url(#a)"/>
  <text x="766" y="205" class="l" fill="#334155">HTTP / JSON</text>
  <text x="100" y="204" class="s">reports, status, conflicts, logs, recovery</text>
  <text x="1010" y="180" class="s">admin actions need X-Admin-Token</text>

  <!-- Regions -->
  <g>
    <rect x="70" y="234" width="360" height="146" rx="12" class="box" stroke="#ff9900"/>
    <rect x="70" y="234" width="360" height="30" rx="12" fill="#ff9900"/>
    <text x="250" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1300">AWS - Mumbai (ap-south-1)</text>
    <text x="250" y="292" text-anchor="middle" class="t">Region node  mum</text>
    <text x="250" y="316" text-anchor="middle" class="s">EC2 + Docker | FastAPI | SQLite event log</text>
    <text x="250" y="338" text-anchor="middle" class="s">Own copy of all data, own database</text>
    <text x="250" y="360" text-anchor="middle" class="s">Elastic IP, port 8001</text>
  </g>
  <g>
    <rect x="570" y="234" width="360" height="146" rx="12" class="box" stroke="#ff9900"/>
    <rect x="570" y="234" width="360" height="30" rx="12" fill="#ff9900"/>
    <text x="750" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#1f1300">AWS - Hyderabad (ap-south-2)</text>
    <text x="750" y="292" text-anchor="middle" class="t">Region node  hyd</text>
    <text x="750" y="316" text-anchor="middle" class="s">EC2 + Docker | FastAPI | SQLite event log</text>
    <text x="750" y="338" text-anchor="middle" class="s">Own copy of all data, own database</text>
    <text x="750" y="360" text-anchor="middle" class="s">Elastic IP, port 8002</text>
  </g>
  <g>
    <rect x="1070" y="234" width="360" height="146" rx="12" class="box" stroke="#0078d4"/>
    <rect x="1070" y="234" width="360" height="30" rx="12" fill="#0078d4"/>
    <text x="1250" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Azure - Singapore (southeastasia)</text>
    <text x="1250" y="292" text-anchor="middle" class="t">Region node  sin</text>
    <text x="1250" y="316" text-anchor="middle" class="s">Azure VM + Docker | FastAPI | SQLite event log</text>
    <text x="1250" y="338" text-anchor="middle" class="s">Own copy of all data, own database</text>
    <text x="1250" y="360" text-anchor="middle" class="s">Static IP, port 8003</text>
  </g>

  <!-- Replication mesh -->
  <path class="ln" d="M432 320 L568 320" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M932 320 L1068 320" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M250 382 C250 452 1250 452 1250 382" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="500" y="308" text-anchor="middle" class="l">pull sync</text>
  <text x="1000" y="308" text-anchor="middle" class="l">pull sync</text>
  <text x="750" y="462" text-anchor="middle" class="l">pull sync (version vector in, missing events out), relayed through any reachable region</text>

  <!-- Inside one node -->
  <rect x="70" y="474" width="1000" height="360" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="90" y="500" class="t">Inside every node (same code on every region)</text>

  <rect x="100" y="520" width="190" height="78" rx="10" class="box"/>
  <text x="195" y="544" text-anchor="middle" class="t">API gate</text>
  <text x="195" y="564" text-anchor="middle" class="s">admin-token check</text>
  <text x="195" y="582" text-anchor="middle" class="s">paused = 503, CORS</text>

  <rect x="330" y="520" width="190" height="78" rx="10" class="box"/>
  <text x="425" y="544" text-anchor="middle" class="t">REST handlers</text>
  <text x="425" y="564" text-anchor="middle" class="s">/reports /conflicts /status</text>
  <text x="425" y="582" text-anchor="middle" class="s">/logs /recovery /admin/*</text>

  <rect x="560" y="520" width="200" height="78" rx="10" class="box" stroke="#0f766e"/>
  <text x="660" y="544" text-anchor="middle" class="t">Event store</text>
  <text x="660" y="564" text-anchor="middle" class="s">SQLite, append-only</text>
  <text x="660" y="582" text-anchor="middle" class="s">hash-chained events</text>

  <rect x="800" y="520" width="240" height="78" rx="10" class="box" stroke="#7c3aed"/>
  <text x="920" y="544" text-anchor="middle" class="t">Merge engine</text>
  <text x="920" y="564" text-anchor="middle" class="s">hybrid clocks + version vectors</text>
  <text x="920" y="582" text-anchor="middle" class="s">report state + conflict ledger</text>

  <path class="ln" d="M290 559 L328 559" marker-end="url(#a)"/>
  <path class="ln" d="M520 559 L558 559" marker-end="url(#a)"/>
  <path class="ln" d="M760 559 L798 559" marker-end="url(#a)"/>

  <rect x="100" y="690" width="260" height="92" rx="10" class="box"/>
  <text x="230" y="714" text-anchor="middle" class="t">Sync manager</text>
  <text x="230" y="734" text-anchor="middle" class="s">one thread per peer</text>
  <text x="230" y="752" text-anchor="middle" class="s">in-order, idempotent apply</text>
  <text x="230" y="770" text-anchor="middle" class="s">refuses peers on another epoch</text>

  <rect x="400" y="690" width="260" height="92" rx="10" class="box"/>
  <text x="530" y="714" text-anchor="middle" class="t">Recovery reports</text>
  <text x="530" y="734" text-anchor="middle" class="s">outage start / link back / caught up</text>
  <text x="530" y="752" text-anchor="middle" class="s">before - during - after snapshots</text>
  <text x="530" y="770" text-anchor="middle" class="s">changes, conflicts, failures</text>

  <rect x="700" y="690" width="340" height="92" rx="10" class="box" stroke="#13aa52"/>
  <text x="870" y="714" text-anchor="middle" class="t">Activity log</text>
  <text x="870" y="734" text-anchor="middle" class="s">in-memory buffer + background writer</text>
  <text x="870" y="752" text-anchor="middle" class="s">writes, links, sync, conflicts, recovery</text>
  <text x="870" y="770" text-anchor="middle" class="s">never blocks a request</text>

  <!-- internal links -->
  <path class="ln" d="M230 690 V648 H610 V600" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="420" y="640" text-anchor="middle" class="l">events in / out</text>
  <path class="ln" d="M360 736 L398 736" marker-end="url(#a)"/>
  <path class="ln" d="M660 736 L698 736" marker-end="url(#a)"/>
  <path class="ln" d="M425 600 V626 H800 V690" marker-end="url(#a)"/>
  <text x="720" y="620" text-anchor="middle" class="l">writes</text>
  <path class="ln" d="M920 600 V690" marker-end="url(#a)"/>
  <text x="988" y="650" text-anchor="middle" class="l">conflicts</text>

  <path class="ln" d="M230 782 V822" marker-end="url(#a)"/>
  <text x="246" y="812" class="s">to and from the other regions</text>

  <!-- Fault injection -->
  <rect x="1150" y="474" width="280" height="130" rx="12" class="box" stroke="#dc2626"/>
  <text x="1290" y="500" text-anchor="middle" class="t">Fault injection (admin token)</text>
  <text x="1290" y="526" text-anchor="middle" class="s">cut / restore a link | pause a node</text>
  <text x="1290" y="546" text-anchor="middle" class="s">skew its clock  |  reset the epoch</text>
  <text x="1290" y="574" text-anchor="middle" class="s">Simulated in the app,</text>
  <text x="1290" y="592" text-anchor="middle" class="s">the servers keep running</text>
  <path class="ln" d="M1148 540 L1074 540" marker-end="url(#a)"/>

  <!-- Atlas -->
  <ellipse cx="1290" cy="660" rx="140" ry="20" fill="#e8f7ee" stroke="#13aa52" stroke-width="1.5"/>
  <path d="M1150 660 V752 A140 20 0 0 0 1430 752 V660" fill="#e8f7ee" stroke="#13aa52" stroke-width="1.5"/>
  <ellipse cx="1290" cy="660" rx="140" ry="20" fill="#f1fbf5" stroke="#13aa52" stroke-width="1.5"/>
  <text x="1290" y="702" text-anchor="middle" class="t">MongoDB Atlas</text>
  <text x="1290" y="722" text-anchor="middle" class="s">activity_logs (per region)</text>
  <text x="1290" y="740" text-anchor="middle" class="s">expires after 14 days</text>
  <path class="ln" d="M1042 736 L1150 716" stroke="#13aa52" marker-end="url(#g)"/>
  <text x="1110" y="690" text-anchor="middle" class="l">async batches</text>
  <path class="dash" d="M1431 700 H1468 V312 H1432" marker-end="url(#g)"/>
  <text x="1290" y="796" text-anchor="middle" class="s">Dashboard reads it back through GET /logs.</text>
  <text x="1290" y="814" text-anchor="middle" class="s">Any region can serve any region's log.</text>

  <!-- Deployment -->
  <rect x="70" y="868" width="1360" height="130" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="894" class="t">How it gets deployed</text>
  <rect x="100" y="910" width="300" height="70" rx="10" class="box"/>
  <text x="250" y="934" text-anchor="middle" class="t">GitHub repo</text>
  <text x="250" y="954" text-anchor="middle" class="s">engine + built dashboard</text>
  <text x="250" y="970" text-anchor="middle" class="s">one Docker image for every node</text>
  <path class="ln" d="M402 945 L478 945" marker-end="url(#a)"/>
  <rect x="480" y="910" width="440" height="70" rx="10" class="box" stroke="#ff9900"/>
  <text x="700" y="934" text-anchor="middle" class="t">AWS: infra/aws_cluster.py (boto3)</text>
  <text x="700" y="954" text-anchor="middle" class="s">EC2 in Mumbai and Hyderabad, security group, Elastic IPs</text>
  <text x="700" y="970" text-anchor="middle" class="s">boot script builds and starts the container</text>
  <rect x="960" y="910" width="440" height="70" rx="10" class="box" stroke="#0078d4"/>
  <text x="1180" y="934" text-anchor="middle" class="t">Azure: infra/azure_cluster.py (az CLI)</text>
  <text x="1180" y="954" text-anchor="middle" class="s">VM in Singapore, static IP, in-place update</text>
  <text x="1180" y="970" text-anchor="middle" class="s">same image, same admin token</text>
  <path class="ln" d="M922 945 L958 945" marker-end="url(#a)" opacity="0"/>

  <!-- legend -->
  <line x1="1130" y1="1014" x2="1170" y2="1014" class="ln" marker-end="url(#a)"/>
  <text x="1178" y="1018" class="s">data flow</text>
  <line x1="1262" y1="1014" x2="1302" y2="1014" class="dash" marker-end="url(#g)"/>
  <text x="1310" y="1018" class="s">read for the dashboard</text>
</svg>
